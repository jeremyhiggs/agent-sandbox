name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.11.7
      - run: mise run setup
      - run: mise run check

  audit:
    strategy:
      fail-fast: false
      matrix:
        check: [node, tools, repo, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.11.7
      - run: mise run setup
      - run: mise run audit:${{ matrix.check }}
      - name: Preserve repository audit reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: repository-audit-${{ matrix.check }}
          path: .artifacts/*.json
          if-no-files-found: ignore

  image:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        variant: [base, browser]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.11.7
      - name: Build Linux image
        run: mise run build:ci --variant ${{ matrix.variant }}
      - name: Check npm-free core image
        run: mise run check:image:ci
      - name: Test actual browser engine
        if: matrix.variant == 'browser'
        run: mise run check:image:ci --browser
      - name: Scan OS and language dependencies
        run: mise run scan:ci
      - name: Preserve complete vulnerability report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vulnerabilities-${{ matrix.runner }}-${{ matrix.variant }}
          path: .artifacts/vulnerabilities-*.json
          if-no-files-found: ignore
