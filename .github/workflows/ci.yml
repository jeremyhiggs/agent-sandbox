name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_notes: ${{ steps.release.outputs.notes }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install checksum-verified tools
        run: bash scripts/ci-setup.sh
      - name: Install locked development dependencies
        run: mise run setup
      - name: Check source, locks, and browser advisories
        run: mise run check
      - name: Verify Docker build context
        run: mise run smoke:context:ci
      - name: Detect a version bump
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: mise exec -- node scripts/release-plan.ts

  audit:
    strategy:
      fail-fast: false
      matrix:
        check: [node, tools, host-tools, repo, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install checksum-verified tools
        run: bash scripts/ci-setup.sh
      - name: Install locked development dependencies
        run: mise run setup
      - name: Audit ${{ matrix.check }}
        run: mise run audit:${{ matrix.check }}
      - name: Preserve repository audit reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: repository-audit-${{ matrix.check }}
          path: .artifacts/*.json
          include-hidden-files: true
          if-no-files-found: ignore

  image:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install checksum-verified tools
        run: bash scripts/ci-setup.sh
      - name: Build Linux image
        id: build
        run: mise run build:ci
      - name: Check browser and agent separation in every image
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mise run check:image:ci
      - name: Scan OS and language dependencies
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mise run scan:ci
      - name: Preserve complete vulnerability report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vulnerabilities-${{ matrix.runner }}
          path: |
            .artifacts/vulnerabilities-*.json
            .artifacts/apko/sbom/**
          include-hidden-files: true
          if-no-files-found: ignore

  release:
    needs: [check, audit, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check.outputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.check.outputs.release_tag }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Publish the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
          RELEASE_NOTES: ${{ needs.check.outputs.release_notes }}
        run: bash scripts/publish-release.sh
